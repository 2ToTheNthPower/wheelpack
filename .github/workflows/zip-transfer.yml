      - name: Upload windows-x64 / Python 3.13
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: target-zip-windows-x64-py3.13-${{ env.TRANSFER_PRODUCER }}
          path: transfer-out/windows-x64-py3.13/

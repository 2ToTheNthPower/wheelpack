name: CI

'on':
  push:
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_PYTHON: cpython-3.12-linux-x86_64-gnu
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: pyproject.toml
          enable-cache: false
      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: .github/workflows/ci.yml .github/workflows/musl.yml .github/workflows/zip-transfer.yml
      - name: Install managed Python
        run: uv python install "$UV_PYTHON"
      - name: Install locked dependencies
        run: uv sync --locked --python "$UV_PYTHON"
      - name: Lint Python
        run: uv run --locked --python "$UV_PYTHON" ruff check .
      - name: Build wheel and sdist
        run: uv build --python "$UV_PYTHON"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  native:
    name: ${{ matrix.platform.runner }} / CPython ${{ matrix.python }} / ${{ matrix.platform.arch }} / ${{ matrix.platform.libc }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        platform:
          - {runner: ubuntu-22.04, os: linux, arch: x86_64, libc: gnu}
          - {runner: ubuntu-24.04, os: linux, arch: x86_64, libc: gnu}
          - {runner: ubuntu-24.04-arm, os: linux, arch: aarch64, libc: gnu}
          - {runner: macos-15-intel, os: macos, arch: x86_64, libc: none}
          - {runner: macos-15, os: macos, arch: aarch64, libc: none}
          - {runner: windows-2022, os: windows, arch: x86_64, libc: none}
          - {runner: windows-2025, os: windows, arch: x86_64, libc: none}
          - {runner: windows-11-arm, os: windows, arch: aarch64, libc: none}
    env:
      UV_PYTHON: cpython-${{ matrix.python }}-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ matrix.platform.libc }}
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: pyproject.toml
          python-version: ${{ env.UV_PYTHON }}
          enable-cache: false
      - name: Install managed Python
        run: uv python install "${{ env.UV_PYTHON }}"
      - name: Install locked dependencies
        run: uv sync --locked --python "${{ env.UV_PYTHON }}"
      - name: Run full native suite
        run: >-
          uv run --locked --python "${{ env.UV_PYTHON }}" python scripts/ci.py
          --expected-os "${{ matrix.platform.os }}" --expected-arch "${{ matrix.platform.arch }}"
          --expected-python "${{ matrix.python }}" --expected-libc "${{ matrix.platform.libc }}"
      - name: Preserve test reports even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.platform.runner }}-${{ matrix.platform.arch }}-py${{ matrix.python }}
          path: ci-results/
          if-no-files-found: warn

  tox:
    name: tox / CPython 3.10-3.14
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: pyproject.toml
          enable-cache: false
      - name: Install managed Python versions
        run: |
          for version in 3.10 3.11 3.12 3.13 3.14; do
            uv python install "$version"
          done
      - name: Expose managed interpreters to tox
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          for version in 3.10 3.11 3.12 3.13 3.14; do
            ln -sf "$(uv python find "$version")" "$HOME/.local/bin/python$version"
          done
      - name: Run the suite across every supported Python
        run: uvx tox
      - name: Preserve tox results even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tox-results
          path: .tox/**/.pytest_cache/
          if-no-files-found: warn

  required:
    name: Required Native Checks
    runs-on: ubuntu-24.04
    needs: [lint-build, native, tox]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Require every native, tox, and lint/build job to succeed
        env:
          LINT_RESULT: ${{ needs.lint-build.result }}
          TEST_RESULT: ${{ needs.native.result }}
          TOX_RESULT: ${{ needs.tox.result }}
        run: |
          test "$LINT_RESULT" = success
          test "$TEST_RESULT" = success
          test "$TOX_RESULT" = success

name: Musl

'on':
  push:
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '47 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  musl:
    name: Alpine / CPython ${{ matrix.python }} / ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        platform:
          - {runner: ubuntu-24.04, arch: x86_64}
          - {runner: ubuntu-24.04-arm, arch: aarch64}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        id: uv
        with:
          version-file: pyproject.toml
          enable-cache: false
      # Use the project's uv pin, with no apk/pip/system Python fallback.
      # ARM uses a native ARM runner, not QEMU; the script asserts the process architecture.
      - name: Run full suite in native musl container
        shell: bash
        env:
          UV_PYTHON: cpython-${{ matrix.python }}-linux-${{ matrix.platform.arch }}-musl
          EXPECTED_ARCH: ${{ matrix.platform.arch }}
          EXPECTED_PYTHON: ${{ matrix.python }}
          UV_VERSION: ${{ steps.uv.outputs.uv-version }}
        run: |
          docker run --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace" \
            --workdir /workspace \
            --env UV_PYTHON --env EXPECTED_ARCH --env EXPECTED_PYTHON \
            --env UV_PYTHON_PREFERENCE=only-managed \
            --env UV_PROJECT_ENVIRONMENT=/tmp/wheelpack-venv \
            --env XDG_CACHE_HOME=/tmp/cache \
            --env UV_CACHE_DIR=/tmp/cache/uv \
            --env UV_PYTHON_INSTALL_DIR=/tmp/uv-python \
            "ghcr.io/astral-sh/uv:${UV_VERSION}-alpine3.22" sh scripts/ci-musl.sh
      - name: Preserve test reports even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: musl-${{ matrix.platform.arch }}-py${{ matrix.python }}
          path: ci-results/
          if-no-files-found: warn

  required:
    name: Required Musl Checks
    runs-on: ubuntu-24.04
    needs: musl
    if: always()
    timeout-minutes: 5
    steps:
      - name: Require every musl job to succeed
        env:
          TEST_RESULT: ${{ needs.musl.result }}
        run: test "$TEST_RESULT" = success

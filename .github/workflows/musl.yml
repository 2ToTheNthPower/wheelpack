name: Musl

'on':
  push:
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '47 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  musl:
    name: Alpine / CPython ${{ matrix.python }} / ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        platform:
          - {runner: ubuntu-24.04, arch: x86_64}
          - {runner: ubuntu-24.04-arm, arch: aarch64}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: jetify-com/devbox-install-action@734088efddca47cf44ff8a09289c6d0e51b73218 # v0.12.0
        with:
          devbox-version: 0.18.3
      # Docker is Devbox-managed. Nix cannot run inside musl: the official uv image
      # supplies the same pinned uv as Devbox, with no apk/pip/system Python fallback.
      # ARM uses a native ARM runner, not QEMU; the script asserts the process architecture.
      - name: Run full suite in native musl container
        shell: bash
        env:
          UV_PYTHON: cpython-${{ matrix.python }}-linux-${{ matrix.platform.arch }}-musl
          EXPECTED_ARCH: ${{ matrix.platform.arch }}
          EXPECTED_PYTHON: ${{ matrix.python }}
        run: |
          read -r tool uv_version rest <<< "$(devbox run -- uv --version)"
          test "$tool" = uv
          # Variables in the single-quoted script expand inside the container.
          # shellcheck disable=SC2016
          devbox run -- docker run --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace" \
            --workdir /workspace \
            --env UV_PYTHON --env EXPECTED_ARCH --env EXPECTED_PYTHON \
            --env UV_PYTHON_PREFERENCE=only-managed \
            --env UV_PROJECT_ENVIRONMENT=/tmp/wheelport-venv \
            --env XDG_CACHE_HOME=/tmp/cache \
            --env UV_CACHE_DIR=/tmp/cache/uv \
            --env UV_PYTHON_INSTALL_DIR=/tmp/uv-python \
            "ghcr.io/astral-sh/uv:${uv_version}-alpine3.22" sh -ec '
              uv python install "$UV_PYTHON"
              uv sync --locked --python "$UV_PYTHON"
              uv run --locked --python "$UV_PYTHON" python scripts/ci.py \
                --expected-os linux --expected-arch "$EXPECTED_ARCH" \
                --expected-python "$EXPECTED_PYTHON" --expected-libc musl
            '
      - name: Preserve test reports even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: musl-${{ matrix.platform.arch }}-py${{ matrix.python }}
          path: ci-results/
          if-no-files-found: warn

  required:
    name: Required Musl Checks
    runs-on: ubuntu-24.04
    needs: musl
    if: always()
    timeout-minutes: 5
    steps:
      - name: Require every musl job to succeed
        env:
          TEST_RESULT: ${{ needs.musl.result }}
        run: test "$TEST_RESULT" = success

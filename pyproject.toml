[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wheelport"
version = "0.1.0"
description = "Carry Python environments across the air gap as self-contained wheel bundles"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["packaging>=25", "pip>=25"]

[project.scripts]
wheelport = "wheelport.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "poetry>=2", "poetry-plugin-export>=1.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
